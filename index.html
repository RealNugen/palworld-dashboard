<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nugens Server Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>NUGENS SERVER</h1>
    <button id="menu-btn">≡ MENU</button>
  </header>

  <!-- Das Klappmenü für Palworld -->
  <div id="menu-box" class="server-info-box hidden">
    <h3>PALWORLD SERVER INFO</h3>
    <p>Klicke auf die Adresse zum Kopieren:</p>
    <div class="copy-address" onclick="copyToClipboard('realnugen.duckdns.org:8211', this)">
      <code>realnugen.duckdns.org:8211</code>
      <span class="copy-hint">Kopieren</span>
    </div>
  </div>

  <main>
    <div class="card">
      <div class="card-header">
        <span id="status-text">PS C:\SYSTEM> CONNECTING...</span>
        <span class="badge">• LIVE</span>
      </div>
      <div class="metrics">
        <div><label>SYSTEM UPTIME</label><p id="uptime">--</p></div>
        <div><label>SYSTEM LOAD</label><p id="load">--</p></div>
        <div><label>DISK USAGE (/)</label><p id="disk">--</p></div>
        <div><label>MEMORY USAGE</label><p id="memory">--</p></div>
        <div><label>TEMPERATURE</label><p id="temp">-- °C</p></div>
        <div><label>PROCESSES</label><p id="processes">--</p></div>
      </div>
      <div class="footer-info">
        Users logged in: <span id="users-logged">0</span><br>
        IPv4 address (wlp3s0): 192.168.178.35
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
